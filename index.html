}
function addInv(name,c,base,qty,unit,meta){
  const s=S.inv.find(x=>x.name===name);
  if(s){s.cost=(s.cost*s.qty+unit*qty)/(s.qty+qty);s.qty+=qty;s.cond=Math.max(s.cond,1)}
  else S.inv.push({id:S.seq++,name,c,base,qty,cost:unit,cond:1,draft:1.1,listed:false,dk:0,thread:null,...(meta||{})});
  dirty=true;
}

/* ═════════════ marketplace */
function hype(){return clamp(1+S.boosts.filter(b=>b.until>S.t).reduce((a,b)=>a+b.add,0),.5,3)}
function trafficMult(){return (S.adsUntil>S.t?CFG.adMult:1)*(1+S.boosts.filter(b=>b.until>S.t).reduce((a,b)=>a+(b.traffic||0),0))}
function offerVal(st){const sat=has('bulkBuyer')?1-(1-cf('saturation'))*CFG.perks.bulk:cf('saturation');return unitVal(st)*hype()*Math.pow(CFG.perks.verified,run('verified'))*Math.pow(sat,S.soldToday[st.name]||0)}
const askOf=st=>psych(unitVal(st)*st.draft);
// audit #3: how many buyers this asking price draws (message odds fall with (ask / offer value)²)
const pband=st=>{const r=askOf(st)/Math.max(1,offerVal(st));return r<=CFG.band.most?'most':r<=CFG.band.some?'some':'few'};
const listedValue=()=>S.inv.filter(s=>s.listed).reduce((a,s)=>a+unitVal(s)*s.qty,0);
const adCost=()=>Math.max(15,Math.round(listedValue()*CFG.adShare*(has('influencer')?CFG.perks.influencer:1)));
const boostCost=b=>Math.max(15,Math.round(listedValue()*b.cost));
function buyerOffer(m,st){
  const ask=askOf(st),will=m.will;
  if(will>=ask){if(will>=ask*1.05&&Math.random()<.5){m.k='over';m.offer=psych(Math.min(will,ask*1.3))}else{m.k='full';m.offer=ask}}
  else if(will>=ask*.85){m.k='fair';m.offer=psych(will)}
  else{m.k='low';m.offer=psych(will*R(.78,.94))}
}
function makeMsg(st){
  const v=offerVal(st)*cf('lowball'),ask=askOf(st);
  const W=[['buyer',5],['avail',.6],['scam',.5],['ship',.4],['trade',.3]];
  let x=Math.random()*wsum(W.map(w=>w[1])),k='avail';for(const [n,w] of W){if((x-=w)<=0){k=n;break}}
  const want=pick([1,1,1,2,2,3,4,5]);
  const m={id:S.seq++,sid:st.id,name:st.name,c:st.c,who:pick(BUY.names),pays:pick(BUY.paysOk),k,st:'open',via:S.adsUntil>S.t?'ad':null,boosted:S.boosts.some(b=>b.until>S.t&&b.add>0),exp:S.t+CFG.msgLife*pace(),will:v*R(.85,1.15),q:Math.max(1,Math.min(st.qty,['buyer','scam'].includes(k)?want:1))};
  if(k==='buyer'){buyerOffer(m,st);if(Math.random()<.05){m.k='over';m.offer=psych(ask*R(1.3,1.7))}}
  if(k==='scam'){m.offer=psych(ask*R(1.3,1.6));m.pays=pick(BUY.paysScam);if(Math.random()<.4)m.who=pick(BUY.suspiciousNames)}
  if(k==='scam'||k==='ship')m.flag=Math.random()<.3;
  if(k==='ship'){m.pays=BUY.paysShip;m.fee=Math.max(25,psych(v*.08))}
  if(k==='trade'){m.pays=BUY.paysTrade;const B=pool().BASE.filter(x=>x.c!==st.c),tv=tierOf(v),near=Math.min(...B.map(x=>Math.abs(x.tier-tv)));m.trade=pick(B.filter(x=>Math.abs(x.tier-tv)<=Math.max(1,near))).i}   // H-094: at Act III prices, the nearest tier
  if(k==='avail')m.pays='';
  return m;
}
function msgText(m){
  const each=m.q>1?` each for ${m.q}`:'';
  if(m.k==='dark')return isPH(BUY.dark.message)?phHTML('buyers.dark.message'):esc(BUY.dark.message);
  if(m.k==='sting')return T('buyers.sting.message',{offer:money(m.offer*(m.q||1))});
  return esc(fill(BUY.messages[m.k]||'',{offer:money(m.offer||0),each,fee:money(m.fee||0),trade:m.trade!=null?pool().BASE[m.trade].n:''}));
}
function sellOne(st,amt,who,q=1){
  q=Math.min(q,st.qty);if(q<=0)return;
  const gross=amt*q,fee=gross*CFG.marketFee;S.cards[0].bal+=gross-fee;S.stats.sold+=q;S.stats.fees+=fee;S.stats.earned+=gross;S.day_.rev+=gross-fee;S.day_.sold+=q;
  S.soldToday[st.name]=(S.soldToday[st.name]||0)+q;
  const profit=amt*(1-CFG.marketFee)-st.cost,ratio=amt/Math.max(1,unitVal(st)),stars=ratio<=.95?5:ratio<=1.12?4:ratio<=1.3?3:2;
  S.day_.profit+=profit*q;S.day_.sales.push({name:st.name,amt:gross,q,pl:profit*q,who,stars});S.stats.profit+=profit*q;if(profit<0)lossAdd('below',-profit*q);
  {const pct=profit/Math.max(1,st.cost);if(!S.best||pct>S.best.pct){if(S.best&&pct>0&&S.cel.sale&&S.cel.flipDay!==S.day){S.cel.flipDay=S.day;obie('say.bestFlip')}S.best={name:st.name,pct}}}
  const firstSale=!S.cel.sale;if(firstSale){S.cel.sale=true;obie('say.firstSale',{front:true});if(S.day===1)talk('A2')}   // C15: Obie celebrates
  if(!firstSale)obSale(st,q);else obMoment('smile',3000);
  st.qty-=q;if(st.qty<=0)removeStack(st);
  note(`Sold ${q}× ${st.name} to ${who} for ${money(gross)}.`,profit>=0?'good':'warn');
  if(st.dk>=1&&act_()>=2){alekos('darkSale',{},{force:!S.cel.darkSale});S.cel.darkSale=true}
  else if(profit<-st.cost*.25)alekos('lowSale');else if(profit>Math.max(200,st.cost))alekos('bigSale');
  else if(act_()>=2&&band()==='cool'&&Math.random()<CFG.cleanSaleSay)alekos('cleanSale');
}
function removeStack(st){S.inv=S.inv.filter(x=>x!==st);S.msgs.forEach(m=>{if(m.sid===st.id&&m.st==='open'){m.st='closed';m.res=BUY.results.soldOut}})}

/* ═════════════ stocks (one index, day trading) */
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
let mkDirty=true;
function mkStep(dt){const k=S.mk;k.acc=(k.acc||0)+dt;
  while(k.acc>=1){k.acc-=1;
    k.target*=Math.exp(gauss()*.012);
    k.p+=(k.target-k.p)*CFG.mkt.rev+k.p*CFG.mkt.vol*gauss();
    if(Math.random()<CFG.mkt.shock){const up=Math.random()<.5,f=R(.07,.15);k.p*=up?1+f:1-f;k.target*=up?1+f/2:1-f/2;const arr=D.ticker.markets[up?'up':'down'];const i=Math.floor(Math.random()*arr.length);news({key:`ticker.markets.${up?'up':'down'}.${i}`,ch:'markets'})}
    k.p=Math.max(5,k.p);k.hist.push(+k.p.toFixed(2));if(k.hist.length>600)k.hist.shift();mkDirty=true}}
// H-084: off-hours the index keeps drifting slowly (after-hours quotes), so the chart is never frozen. Trading stays closed,
// and positions are always sold at clock-out, so this changes nothing in play.
function mkDrift(now){const k=S.mk,D_=CFG.mkt.drift;if(!k||now-(k.driftAt||0)<D_.every)return;k.driftAt=now;
  k.target*=Math.exp(gauss()*D_.vol*.5);k.p=Math.max(5,k.p+(k.target-k.p)*CFG.mkt.rev+k.p*D_.vol*gauss());k.hist.push(+k.p.toFixed(2));if(k.hist.length>600)k.hist.shift();mkDirty=true}
function mkBuy(amt){if(!['shop','sell','dusk'].includes(S.phase))return;if(amt>S.cards[0].bal)return;const k=S.mk;   // V43: set dollar amounts
  S.cards[0].bal-=amt;S.day_.spent+=amt;k.sh+=amt*(1-CFG.mkt.fee)/k.p;   // Y38: counts as spent for the idle fee
  k.basis+=amt;S.stats.fees+=amt*CFG.mkt.fee;note(`Bought ${money(amt)} of the index at ${k.p.toFixed(2)}.`)}
function mkSell(f=1){const k=S.mk;if(k.sh<=0)return 0;const sh=f>=1?k.sh:k.sh*f,bs=f>=1?k.basis:k.basis*f,g=sh*k.p,v=g*(1-CFG.mkt.fee),pl=v-bs;S.stats.profit+=pl;
  S.cards[0].bal+=v;S.stats.fees+=g*CFG.mkt.fee;S.day_.mkt=(S.day_.mkt||0)+pl;S.stats.mkt=(S.stats.mkt||0)+pl;if(pl<0)lossAdd('markets',-pl);k.sh-=sh;k.basis-=bs;if(k.sh<1e-9){k.sh=0;k.basis=0}
  note(`Sold your index position for ${money(v)} (${pl>=0?'+'+money(pl):money(pl)}).`,pl>=0?'good':'bad');return v}

/* ═════════════ loop */
function step(dt){
  S.t+=dt;const P=S.phase;
  if(P==='shop'){
    for(const d of S.deals)if(d.stock<=0&&d.deadAt==null)d.deadAt=S.t;
    if(S.t>=S.nextDeal){if(S.deals.length<CFG.maxDeals||S.deals.some(deadDeal))dealPush(makeDeal());S.nextDeal=S.t+R(...CFG.dealEvery);dirty=true}
    for(const d of S.deals){
      if(!d.trap&&d.stock>held(d.id)&&!d.scam&&Math.random()<.06*dt){d.stock--;dirty=true}
      if(d.exp&&S.t>=d.exp&&d.stock>0&&!d.expired){d.expired=true;d.stock=Math.min(d.stock,held(d.id));if(d.rec&&!d.recBought&&!d.trap&&!held(d.id))obRefuse();dirty=true}   // C15: a recommendation left to expire is a refusal
      if(d.expired&&d.stock>0&&!held(d.id)){d.stock=0;dirty=true}
    }
    if(S.trap.state==='armed'&&S.t>=S.trap.pushAt)trapPush();
    if(S.trap.state==='pushed'){const d=S.deals.find(x=>x.id===S.trap.dealId);if(!d||(d.stock<=0&&!inCart(d.id)))trapDodged()}
    if(S.t>=S.nextPop&&S.pops.length<2){S.pops.push({id:S.seq++,ad:Math.floor(Math.random()*POPS.length),x:R(4,50),y:R(2,38)});S.nextPop=S.t+R(...CFG.popEvery);dirty=true}
    if(S.t-S.lastBuy>30){S.lastBuy=S.t;alekos('idle')}
    if(S.icWarnAt&&S.t>=S.icWarnAt){S.icWarnAt=0;if(!S.icWarned)icNews(icChip({c:pick(Object.keys(CATS))}),pick(LOG.ports||LOG.origins),false)}
    if(S.day===3&&!S.talked.B1&&S.t-S.phaseStart>=CFG.talk.favourAt*pace())talk('B1',{fee:money(favourFee())});   // B1: the favour, in shift
  }
  if(P==='shop'||P==='sell'||P==='dusk'){
    if(S.t>=S.slowUntil&&Math.random()<CFG.net.spellChance*cdial('netSpell')*dt)S.slowUntil=S.t+R(...CFG.net.spellDur);
    mkStep(dt);
    S.sched=S.sched.filter(n=>{if(S.t>=n.at){news({key:n.key,art:n.art});return false}return true});
    S.fq=S.fq.filter(x=>{if(S.t>=x.at){const b=x.base||x.path.replace(/\.line$/,''),tx=getPath(b);
      if(S.frep[x.fid]&&tx&&(tx.action||(tx.replies||[]).length)&&(x.held||0)<CFG.textHoldMax){x.at=S.t+CFG.textHold;x.held=(x.held||0)+CFG.textHold;return true}
      fSay(x.fid,fEntry(x.path,x.vars));if(x.fid==='sasha'&&S.day===4&&S.sashaAt==null)S.sashaAt=todMin();
      if(tx&&tx.action==='sendHome'){S.sentOffered=true;S.frep[x.fid]={base:b,n:3,send:true,need:sendNeed()};armNudge(x.fid)}
      else if(tx&&tx.replies&&tx.replies.length){S.frep[x.fid]={base:b,n:tx.replies.length,only:n4Keep()?null:rotIdx(tx.replies.length)};armNudge(x.fid)}return false}return true});   // N4: one reply per node after day 1
    if(S.trap.state==='dodged'&&S.t>=S.trap.confirmAt)trapConfirm();
    if(S.worldAt&&S.t>=S.worldAt){S.worldAt=0;alekos('world',{},{force:true})}
    for(const o of S.orders){
      if(o.st==='refund'){if(S.t>=o.next){o.st='refunded';S.cards[0].bal+=o.cost;log(o,LOG.refund,'good');note(`Refund: ${money(o.cost)} is back.`,'good')}continue}
      if(o.st!=='active')continue;
      if(o.fate==='trap11B'&&S.t>=o.seizeAt){trapSeize(o);continue}
      if(o.doom&&S.t>=o.doom&&o.stage===3){o.doom=null;lose(o,LOG.sank);continue}
      if(o.action){if(o.action.type==='contest'&&S.t>=o.action.at){o.action=null;if(Math.random()<.5){log(o,LOG.contestOk,'good');o.next=S.t+R(...CFG.stageGap)}else lose(o,LOG.seized,true)}continue}
      if(S.t>=o.next)advance(o);
    }
    const fin=S.orders.filter(o=>['done','failed','refunded'].includes(o.st));
    if(fin.length>14){const drop=new Set(fin.slice(14));S.orders=S.orders.filter(o=>!drop.has(o))}
  }
  // Y37 very rare: once a day a buyer who doesn't ask questions takes a listed lot at full asking, instantly
  if(P==='sell'&&run('noQuestions')&&S.nqDay!==S.day){const st=pick(S.inv.filter(x=>x.listed&&x.qty>0)||[]);if(st){S.nqDay=S.day;msgPush({id:S.seq++,sid:st.id,name:st.name,c:st.c,who:pick(BUY.dark.names),pays:'',k:'dark',st:'dark',at:S.t+CFG.dark.sayAt,offer:askOf(st),q:st.qty});dirty=true}}
  if(S.heldLot&&!S.heldLot.in&&(P==='sell'||P==='dusk')&&todMin()>=CFG.talk.lotAt){S.heldLot.in=true;addInv(UIp('market.sealedLot'),'novelty',0,1,0,{sealed:true});note(UIp('market.sealedArrived'),'warn');dirty=true}
  if(act_()>=3&&S.day%CFG.days===1&&P==='sell'&&!S.relistAt&&todMin()>=CFG.act3.relist.at)relistStart();   // H-094 priority relist
  if(S.relist&&S.t>=S.relist.until)relistEnd(false);
  if(act_()>=3&&S.day===dueDay()&&P==='sell'&&!S.stingAt&&todMin()>=CFG.act3.sting.at)stingStart();   // T10
  if(S.sashaAt!=null&&!S.talked.B6&&!S.talked.B6s&&['shop','dusk','sell'].includes(P)&&todMin()>=S.sashaAt+60)talk(S.lentBy&&S.lentBy.sasha?'B6s':'B6');   // H-095 D1: he knows she lent   // B6: about an hour after Sasha's flag text
  if(P==='sell'&&S.adPing&&S.t>=S.adPing){S.adPing=0;const L=S.inv.filter(st=>st.listed&&st.qty>0&&!(st.dk>=1&&act_()>=2));if(L.length){msgPush(makeMsg(pick(L)));dirty=true}}
  if(P==='sell'){
    const open=S.msgs.filter(m=>['open','countering','replied','dark'].includes(m.st)).length;
    for(const st of S.inv){
      if(!st.listed||st.qty<=0||st.sealed)continue;
      if(st.dk>=1&&act_()>=2){if(!S.msgs.some(m=>m.sid===st.id&&m.st==='dark')&&Math.random()<CFG.dark.buyRate*dt*trafficMult()){
        msgPush({id:S.seq++,sid:st.id,name:st.name,c:st.c,who:pick(BUY.dark.names),pays:'',k:'dark',st:'dark',at:S.t+CFG.dark.sayAt,offer:darkOffer(st),q:st.qty});dirty=true;break}continue}
      const r=askOf(st)/offerVal(st);
      const p=CFG.msgRate*dt*trafficMult()*Math.sqrt(demand(st.c))/Math.pow(clamp(r,.6,3),2);
      if(open<CFG.maxMsgs&&Math.random()<p){msgPush(makeMsg(st));dirty=true;break}
    }
    for(const m of S.msgs){
      const st=S.inv.find(x=>x.id===m.sid);
      if(m.st==='dark'&&S.t>=m.at){m.st='closed';m.res=BUY.dark.result;if(st)sellOne(st,m.offer,m.who,m.q);dirty=true;continue}
      if(m.st==='open'&&m.id===hoverM)m.exp+=dt;
      if(m.st==='open'&&S.t>=m.exp){m.st='closed';m.res=BUY.results.expired;if(m.k==='scam'||m.k==='ship')S.stats.dodged++;dirty=true}
      if(m.st==='countering'&&S.t>=m.at){
        if(st&&Math.random()<clamp((m.will/askOf(st)-.75)*2.5,.05,.85)){m.st='closed';m.res=BUY.results.countered;sellOne(st,askOf(st),m.who,m.q)}
        else{m.st='closed';m.res=BUY.results.blocked}
        dirty=true;
      }
      if(m.st==='replied'&&S.t>=m.at){
        if(st&&Math.random()<.55){m.st='open';m.will=offerVal(st)*R(.85,1.15);buyerOffer(m,st);m.exp=S.t+CFG.msgLife*pace()}
        else{m.st='closed';m.res=BUY.results.seen}
        dirty=true;
      }
    }
    for(const b of S.boosts)if(!b.ended&&b.until<=S.t){b.ended=true;dirty=true}
    if(S.adsUntil&&!S.adsEnded&&S.adsUntil<=S.t){S.adsEnded=true;dirty=true}
    for(const m of S.msgs)if(m.st==='closed'&&m.closedAt==null)m.closedAt=S.t;
  }
  const co=S.co;
  if(co){if(co.busy&&S.t>=co.at)resolvePay();else if(!co.busy&&!co.done&&!co.frozen&&S.t>=co.exp){co.msg='Session expired. Your cart was kept.';co.tone='bad';co.done=true;dirty=true}}
  if(P==='shop'||P==='sell'||P==='dusk'){
    S.dayLeft-=dt;
    if((P==='shop'||P==='dusk')&&dayEl()>=buyLen()){if(P==='shop')endShop();openMarket()}   // O16: the market opens at 10:00
    if(P==='sell'&&S.dayLeft<=0){S.dayLeft=0;marketClose()}
  }
}

/* ═════════════ friends (Messenger threads, Y8/Y9; asking is also the checkout fail-safe) */
const fOf=id=>FRIENDS.find(x=>x.id===id);
// Friends speak through fSay so their lines chunk too (Y17); the player's own lines land at once.
function fSay(fid,e,me_=false){const parts=chunks(e);if(me_){parts.forEach(p=>fPush(fid,p,true));return}
  fPush(fid,parts[0]);parts.slice(1).forEach((p,i)=>S.pend.push({fid,k:'chunk',e:p,at:performance.now()+CFG.chat.chunkDelay*(i+1)}))}
function fEntry(path,vars){const v=getPath(path);return isPH(v)?{ph:path}:{txt:fill(v,vars||{})}}
function fPush(fid,e,me_=false){if(e.txt)e={...e,txt:stripEmoji(e.txt)};S.th[fid].push({...e,me:me_,at:clock(),t0:performance.now()});if(!me_)say(fOf(fid).n+': '+plain(e));
  S.th[fid][S.th[fid].length-1].n=++S.mseq;
  if(!me_&&!threadSeen(fid)){S.fu[fid]=(S.fu[fid]||0)+1;if(!e.cont){notify(fOf(fid).n,plain(e),'thread',fid,'msg');chimeF();bump('chat')}}dirty=true}
function isShort(){if(S.co&&S.phase==='shop'&&cartTotal(S.co.ins)>S.cards[0].bal)return true;return S.phase==='settle'&&cash()<S.owed}
const canAsk=fid=>S.cards.length&&S.friendAsks>0&&(!S.asked.includes(fid)||S.reAsk>0)&&!S.pend.some(p=>p.fid===fid)&&isShort();   // Y11: only when short
// Y25: double-text when a friend's text sits unanswered; some replies leave you on "Seen" with no follow-up.

  case'endsell':if(['sell','shut','dusk','shop'].includes(S.phase))endSell();break;
  case'xpop':S.pops=S.pops.filter(p=>p.id!==+id);break;
  case'adcta':{const p=S.pops.find(x=>x.id===+id);S.pops=S.pops.filter(x=>x.id!==+id);if(!p)break;if(p.loan){takeLoan();break}
    const fee=Math.min(cash(),Math.max(5,Math.round(cash()*R(.015,.04))));spend(fee);note(`Charged ${money(fee)}: ${POPS[p.ad].charge}.`,'bad');if(Math.random()<.4)alekos('adClick');break}
  case'duty':{const o=S.orders.find(x=>x.id===+id);if(!o||!o.action)break;const duty=o.action.duty;
    if(cash()<duty){note('Not enough cash for the duty. Contest it, or sell something.','bad');break}
    spend(duty);o.cost+=duty;o.action=null;log(o,LOG.dutyPaid,'good');o.next=S.t+R(...CFG.stageGap);break}
  case'contest':{const o=S.orders.find(x=>x.id===+id);if(o){o.action={type:'contest',at:S.t+5};log(o,LOG.contestStart,'warn')}break}
  case'ofilter':S.ofilter=id;break;
  case'dn':case'upp':{const st=S.inv.find(x=>x.id===+id);if(st)st.draft=clamp(+(st.draft+(a==='dn'?-.05:.05)).toFixed(2),.5,2.5);break}
  case'list':{const st=S.inv.find(x=>x.id===+id);if(st&&st.relist){relistEnd(true);break}if(st&&!st.sealed){st.listed=!st.listed;if(st.listed)st.listedAt=todMin()}checkListedDark();break}
  case'listall':{const rl=S.inv.find(x=>x.relist);if(rl)relistEnd(true);S.inv.forEach(s=>{if(!s.sealed&&!s.listed){s.listed=true;s.listedAt=todMin()}});checkListedDark();break}
  case'ads':{const c=adCost();if(cash()<c||S.phase!=='sell')break;spend(c);S.adsUntil=S.t+CFG.adTime;S.adsEnded=false;S.adPing=S.t+CFG.adPing;break}   // O17: the first ad buyer arrives within seconds
  case'boost':{const b=BOOSTS.find(x=>x.id===id);const c=boostCost(b);if(cash()<c||S.phase!=='sell')break;spend(c);
    if(Math.random()<b.bf){S.boosts.push({id,add:-.3,until:S.t+b.dur,dur:b.dur});note(`Backfired: ${D.marketplace.backfire[id]}`,'bad')}
    else S.boosts.push({id,add:b.add,traffic:b.traffic||0,until:S.t+b.dur,dur:b.dur});break}
  case'acc':{const m=msg(),st=stOf(m);if(!m||m.st!=='open')break;
    if(!st){m.st='closed';m.res=BUY.results.soldOut;break}
    if(m.k==='sting'){m.st='closed';stateEnd({name:st.name},'sting');break}   // T10
    if(m.k==='scam'){lossAdd('scam',Math.min(m.q,st.qty)*st.cost,st.name);st.qty-=Math.min(m.q,st.qty);if(st.qty<=0)removeStack(st);S.stats.scams++;m.st='closed';m.res=BUY.results.scamCheque;note('Cheque scam.','bad');alekos('scam')}
    else if(m.k==='ship'){lossAdd('scam',Math.min(m.fee,cash()),st.name);spend(Math.min(m.fee,cash()));S.stats.scams++;m.st='closed';m.res=BUY.results.scamShip;note('Shipping-fee scam.','bad')}
    else if(m.k==='trade'){const b=pool().BASE[m.trade];st.qty--;if(st.qty<=0)removeStack(st);addInv(b.n,b.c,b.p,1,st.cost);m.st='closed';m.res=`Traded for ${b.n}.`}
    else{m.st='closed';m.res=BUY.results.sold;sellOne(st,m.offer,m.who,m.q)}
    break}
  case'ctr':{const m=msg();if(m&&m.st==='open'){m.st='countering';m.at=S.t+2}break}
  case'reply':{const m=msg();if(m&&m.st==='open'){m.st='replied';m.at=S.t+2}break}
  case'decl':{const m=msg();if(m&&m.st==='open'){m.st='closed';m.res=BUY.results.declined;if(m.k==='scam'||m.k==='ship')S.stats.dodged++}break}
  case'askpick':if(S.co&&!S.co.busy&&FRIENDS.some(f=>canAsk(f.id))){S.co.left=S.co.exp-S.t;S.co.frozen=true;S.fr={stage:'pick'}}break;
  case'ask':askFriend(id);if(S.fr&&S.co)S.fr={stage:'chat',fid:id};break;
  case'sellstocks':if(S.phase==='settle')mkSell();break;
  case'front':frontRun();break;
  case'settleask':S.thread=null;S.focus='chat';if(innerWidth>900)S.chatOpen=true;break;
  case'thread':S.thread=id;S.focus='chat';markRead(id);break;
  case'tounread':{const u=$('#udiv');if(u)u.scrollIntoView({block:'start',behavior:reduced()?'auto':'smooth'});if(S.umark)S.umark.chip=false;break}
  case'tlist':S.thread=null;S.umark=null;break;
  case'openlink':openBrowser('dash');if(S.phase==='cold'&&S.cold===4&&!S.assignAt&&!S.assigned)S.assignAt=performance.now()+1800;break;
  case'article':openArticle(S.noteArts[id]);break;
  case'btab':S.br.cur=id;break;
  case'bmin':animOut('br','bmin');break;
  case'dicon':if(id==='portal'){openBrowser('dash');break}if(id==='handbook')S.hbOpen=true;if(id==='news')S.newsSeen=S.newsLog.filter(n=>n.a).length;deskAct(id);if(!S.wins.includes(id)){S.wins.push(id);animIn('w:'+id)}else S.wins=S.wins.filter(x=>x!==id).concat(id);S.wfocus=id;break;
  case'wclose':animOut('w:'+id,'wclose:'+id);delete S.wmin[id];break;
  case'wmin':S.wmin[id]=true;if(S.wfocus===id)S.wfocus=null;break;   // V53: minimise to the taskbar
  case'wfocus':if(S.wins.includes(id)&&S.wfocus!==id){S.wfocus=id;S.wins=S.wins.filter(x=>x!==id).concat(id)}break;
  case'binfile':S.binOpen=!S.binOpen;if(S.binOpen)deskAct('binfile');break;
  case'photo':S.photoOpen=id===''||id==null?null:+id;break;
  case'rcpt':S.rcptOpen=id||null;break;
  case'newsopen':{const n=S.newsLog[+id];if(n)openArticle(n.a);break}
  case'frback':if(S.co){S.co.exp=S.t+Math.max(S.co.left||6,6);S.co.frozen=false}S.fr=null;break;
  case'payback':{const d=S.iou.find(x=>x.id===id);if(!d||S.cards[0].bal<d.amt)break;S.cards[0].bal-=d.amt;S.iou=S.iou.filter(x=>x!==d);break}
  case'mkamt':S.mkAmt=clamp((S.mkAmt||0)+(+id),0,stockSteps().length-1);break;
  case'mkbuy':if(!S.mkPend){S.mkPend={buy:true,amt:+id};startLoad('stocks',CFG.net.stocks,false)}break;
  case'mksell':if(!S.mkPend){S.mkPend={buy:false,f:+id||1};startLoad('stocks',CFG.net.stocks,false)}break;
  case'next':nextDay();break;
  case'perk':perkPick(id);break;
  case'settlepay':settlePay();break;
  case'liquidate':liquidate();break;
  case'giveup':giveUp();break;
  case'close':if(S.phase==='pass'&&act_()<CFG.lastAct){if(S.perkOffer&&!S.perkOffer.picked)break;perkCommit();nextAct();break}S.phase='closed';S.closeAt=performance.now()+CFG.closedMs;$('#notes').innerHTML='';break;
  case'dbg':debugAct(id);break;
  }
  dirty=true;render();
}
// jumps work from anywhere: before the job starts, they skip the opening and registration and begin the run first
function dbgRun(){if(S.cards&&S.cards.length)return;S.dial=null;S.boot=null;S.cold=4;S.assigned=true;S.stampAt=performance.now()-6e4;beginRun();skipChat();S.replies=[];S.ex=null}
function debugAct(id){
  if(id==='close'){DBG=false;return}
  if(['act2','act3','nextday'].includes(id)&&S.phase==='cold')dbgRun();
  if(id==='reset'){wipeAll();boot();return}   // every node forgotten; the first node boots
  if(id==='cash'&&S.cards[0])S.cards[0].bal+=1000;
  if(id==='cash10'&&S.cards[0])S.cards[0].bal+=10000;
  if(id==='nextday'&&S.cards[0]){if(S.phase==='morning')startShop();if(['shop','dusk','sell','shut'].includes(S.phase))endSell();   // finish today, wake up tomorrow (or settle)
    if(S.phase==='night'){S.perkOffer=null;nextDay()}else if(S.phase==='settle'&&cash()>=S.owed)settlePay();else if(S.phase==='pass'&&act_()<CFG.lastAct){S.perkOffer=null;nextAct()}}
  if(id==='push'&&S.phase==='shop'&&['none','armed'].includes(S.trap.state))trapPush();
  if(id==='act2'&&act_()===1&&S.cards[0]&&S.phase!=='cold'){S.day=CFG.days;S.cards[0].bal=Math.max(S.cards[0].bal,1500);S.offer={lent:nextLine(CFG.next.mult[1].warm),rate:CFG.next.rate[1],fee:0};nextAct()}
  if(id==='act3'&&act_()<3&&S.cards[0]&&S.phase!=='cold'){if(act_()===1)debugAct('act2');S.day=2*CFG.days;S.cards[0].bal=Math.max(S.cards[0].bal,S.owed);S.offer={lent:nextLine(CFG.next.mult[2].warm),rate:CFG.next.rate[2],fee:0};S.owed=0;nextAct()}
  if(id==='heat')heatUp(10,'debug');
  if(id==='cool'){S.heat=0;S.heatLog=S.heatLog.filter(x=>x.why!=='debug')}
  if(id==='trust')S.trust=band()==='warm'?CFG.trust.warmAt-10:CFG.trust.warmAt+10;
  if(id==='relist'&&S.phase==='sell'&&!S.relist)relistStart();
  if(id==='sting'&&S.phase==='sell'){if(!S.inv.some(x=>x.listed&&x.qty>0&&!x.sealed&&!x.relist)){addInv('Debug Watch','collect',2000,1,1500);S.inv[S.inv.length-1].listed=true}S.stingAt=0;stingStart()}
  if(id==='greeks'&&S.cards[0]){S.chatQ=[];S.replies=[];S.ex=null;giveUp()}
  if(id==='state'&&S.cards[0])stateEnd(null,'state');
  if(id==='walk'&&S.cards[0])walkAway();
}

/* ═════════════ frame loop */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);   // H-084: schedule first, so an error in one frame can never stop the game
  const dt=Math.min(.5,(now-last)/1000);last=now;
  if((S.phase==='shop'||S.phase==='sell'||S.phase==='dusk')&&!S.paused&&!S.confirm&&!document.hidden)step(S.phase==='dusk'?dt*CFG.hours.prepSpeed:dt);
  else if(!document.hidden&&!['wipe','doj','decom','closed','greeks'].includes(S.phase))mkDrift(now);
  const delay=band()==='warm'?CFG.chat.warmDelay:CFG.chat.coolDelay;
  if(S.chatQ.length&&now>=chatAt){if(chatAt)popChat();const nx=S.chatQ[0];chatAt=now+(nx&&nx.beat?CFG.chat.chunkDelay:delay)+S.hesPause;S.hesPause=0;dirty=true}
  if(S.preAt&&now>=S.preAt){S.preAt=0;preText()}
  if(S.beat){if(now-S.beat.t0>=CFG.dayBeat.ms)S.beat=null;dirty=true}
  // V52: the morning nudge escalates gently: ~20 s in without opening the portal, the Cipher Browser button flashes (orange
  // holds after) and the portal icon bounces once; again every ~30 s until the portal is opened
  if(S.phase==='morning'&&S.day>1&&S.portalSeen!==S.day&&!S.beat){if(!S.mornAt)S.mornAt=now;
    if(now-S.mornAt>=CFG.nudge.first&&(!S.mornNudge||now-S.mornNudge>=CFG.nudge.every)){S.mornNudge=now;dirty=true}
    else if(S.mornNudge&&now-S.mornNudge<900)dirty=true}
  else if(S.mornAt||S.mornNudge){S.mornAt=0;S.mornNudge=0;dirty=true}
  if(S.ex&&(S.phase!==S.ex.phase||now-S.ex.at>((TALK[S.ex.id]&&TALK[S.ex.id].silenceMs)||CFG.talk.silenceMs)*pace())){talkSilence();chatAt=Math.max(chatAt,now+CFG.chat.warmDelay);dirty=true}
  if(S.hesUntil&&now>=S.hesUntil){S.hesUntil=0;dirty=true}
  nudgeTick(now);alertTick();obTick(now);
  if(S.phase==='cold'&&S.cold===2&&S.offerAt&&now>=S.offerAt){S.offerAt=0;coldNext()}
  if(S.phase==='cold'&&S.cold===4&&S.assignAt&&now>=S.assignAt){S.assignAt=0;S.assigned=true;S.stampAt=now;if(S.node>CFG.firstNode)alekos('newNode',{node:nodeId()},{seq:true,force:true});dirty=true}
  animTick(now);
  if(S.phase==='closed'&&now>=S.closeAt){boot();dirty=true}
  if(S.phase==='settle'&&cash()<S.owed&&!settleOuts().length){if(!S.missAt)S.missAt=now+CFG.missMs;
    else if(!S.missed&&now>=S.missAt){S.missed=true;S.missAt=now+CFG.missSay;say(UIp('settle.missed'));dirty=true}
    else if(S.missed&&now>=S.missAt){S.missAt=0;giveUp()}}
  if(S.phase==='cold'&&S.assigned&&!S.handbook&&now-(S.stampAt||0)>=D.coldopen.register.lines.length*900+nodeId().length*CFG.typeMs+300)handbookIn();   // O22: the handbook lands when registration finishes
  if(S.phase==='cold'&&S.assigned&&now-(S.stampAt||0)<D.coldopen.register.lines.length*900+nodeId().length*CFG.typeMs+500&&now-(S.regTick||0)>(S.cold===4?40:150)){S.regTick=now;dirty=true}
  if(S.phase==='cold'&&S.cold===1&&S.boot&&S.boot.stage==='splash'&&now-S.boot.t0>=CFG.boot.splash){S.boot.stage='welcome';dirty=true}
  if(S.phase==='wipe'&&S.wipe){const g=wipeSig(now);if(g!==S.wipe.sig){S.wipe.sig=g;dirty=true}}   // H-074 #14: re-render only when something new shows
  if(S.dial){const tot=S.dial.steps.reduce((a,b)=>a+b,0);if(now-S.dial.t0>=tot){S.dial=null;coldNext()}else dirty=true}
  if(S.mkPend&&ldState('stocks').done){const m=S.mkPend;S.mkPend=null;if(m.buy)mkBuy(m.amt);else mkSell(m.f);dirty=true}
  if(ldBusy(now)&&now-(S.ldTick||0)>110){S.ldTick=now;dirty=true}
  if(S.phase==='walk'&&S.walk){const W=S.walk,el=now-W.t0;if(el<CFG.walk.mum+400)dirty=true;
    if(W.stage===0&&((W.decomAt&&now>=W.decomAt)||el>CFG.walk.timeout)){W.stage=1;W.offAt=now+CFG.walk.off;dirty=true}
    else if(W.stage===1&&now>=W.offAt){S.phase='decom';dirty=true}}
  if(S.phase==='greeks'){
    if(S.endStage===0&&!S.chatQ.length){S.endStage=1;S.closeAt=now+CFG.greeks.wait;if(act_()>=3)mumLastNote();obEnd('greeks')}   // C15: Obie, polite to the last   // E15: Mum, just before the knock
    else if(S.endStage===1&&now>=S.closeAt){S.endStage=2;S.closeAt=now+CFG.greeks.knock;if(S.ob&&S.ob.cur)S.ob.cur.i=1;knock();rainSwell();dirty=true}   // V45: the rain is sound only
    else if(S.endStage===2&&now>=S.closeAt){S.endStage=3;S.closeAt=now+CFG.greeks.off;if(S.ob)S.ob.gone=true;$('#desk').classList.add('crt-off');dirty=true}
    else if(S.endStage===3&&now>=S.closeAt){S.endStage=4;S.phase='wipe';S.wipe={t0:now,shell:shellLines(),lines:wipeLines('greeks'),noted:0,sig:'',cause:'greeks'};$('#notes').innerHTML='';$('#desk').classList.remove('crt-off');dirty=true}}
  if(S.pend.length){const due=S.pend.filter(p=>now>=p.at);if(due.length){S.pend=S.pend.filter(p=>now<p.at);due.forEach(friendReply)}}
  if(dirty&&!pdown)safeRender();else pulse();   // H-084: one bad draw is logged, not fatal
  if(inDash())ticker(now);
  if(S.ob)renderObie(now);else{const o=document.getElementById('obie');if(o)o.hidden=true}
}
addEventListener('resize',()=>{dirty=true});
// V26 + V37: the rail sits in a permanent left gutter. A card that would slide over a primary control (.act/.big, buyer
// offers) arrives already retracted as a tab instead.
function coversPrimary(el){const r=el.getBoundingClientRect(),W=CFG.noteW;
  return [...document.querySelectorAll('button.act,button.big,.msg button')].some(b=>{if(!b.offsetParent||el.contains(b))return false;const q=b.getBoundingClientRect();return q.left<W&&q.top<r.bottom&&q.bottom>r.top})}
function placeNotes(){const n=$('#notes'),sc=$('#screen');if(!n||!sc)return;n.style.top=(sc.getBoundingClientRect().top+10)+'px'}
addEventListener('scroll',()=>placeNotes(),true);
// H-085: if a restored moment (S10 snapshot) can't be drawn, it is thrown away and the run counts as abandoned (S9):
// the next operator signs in. Nothing is replayed; a crash can never trap the player on a blank page.
function safeRender(){try{render();if(S)S.fromSnap=false}catch(e){console.error(e);dirty=false;if(S&&S.fromSnap){S.fromSnap=false;boot();try{render()}catch(e2){console.error(e2)}}}}
applyOpt();wallInit();boot();safeRender();requestAnimationFrame(t=>{last=t;frame(t)});

</script>
