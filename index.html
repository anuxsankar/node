<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODE</title>
<style>
/* NODE theme tokens (B6). A visual pass is an edit to this file, not to the code.
   Placeholder values: clinical dark terminal, slate grey + soft emerald (V1). Anu sets final values. */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  color-scheme:dark;

  /* surfaces */
  --desk:#0B0E11;            /* desktop behind the windows */
  --desk-glow:#13202B;       /* faint monitor glow on the desktop */
  --panel:#12171C;           /* window body */
  --panel-2:#171D23;         /* raised areas inside a window: cards, inputs */
  --panel-3:#1E252C;         /* hover / selected */
  --bar:#0F1418;             /* top status bar and taskbar */
  --line:#242C34;            /* hairlines */
  --line-strong:#33404B;

  /* text */
  --text:#D5DBE0;
  --text-strong:#F1F4F6;
  --muted:#7D8892;
  --faint:#7D8892;

  /* signal */
  --accent:#4CC79A;          /* soft emerald: primary actions, selection */
  --accent-ink:#04130D;      /* text on accent */
  --accent-soft:#4CC79A1F;
  --up:#4CC79A;              /* tickers: up */
  --down:#E0625A;            /* tickers: down, alerts */
  --warn:#D6A54A;
  --rare:#B9A77A;            /* legendary deals: muted brass, not gold */
  --placeholder:#8E7BD6;     /* TODO(story) text, so it's obvious in playtests */

  /* cold open */
  --crt:#2F5BFF;             /* the only warm light in the room is cold blue */
  --crt-glow:#2F5BFF26;
  --rain:#9FB3C833;

  /* type */
  --font-ui:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-xs:11.5px;
  --fs-s:12.5px;
  --fs-m:13.5px;
  --fs-l:16px;
  --fs-xl:22px;
  --fs-xxl:34px;
  --fw-reg:400;
  --fw-med:500;
  --fw-bold:600;
  --track-caps:.08em;        /* letter-spacing for small caps labels */

  /* shape and space */
  --r-xs:3px;
  --r-s:6px;
  --r-m:8px;
  --r-l:10px;
  --gap-xs:4px;
  --gap-s:8px;
  --gap-m:12px;
  --gap-l:16px;
  --pad-win:14px;
  --shadow:0 18px 40px #00000073,0 1px 0 #FFFFFF08 inset;
  --scrim:#05080BB8;

  /* ── V15: three colour identities. Anu sets the values; the code only maps them.
     Each group restates the surface/text/signal tokens above for its part of the screen.
     OS = his machine (desktop, sign-in, taskbar, status bar, browser frame, notifications): worn, personal.
     Charon = the dashboard pages (Procurement, Logistics, Marketplace, checkout): clinical, perfect, foreign.
     Third = third-party software (Stocks, Messenger, Wallet, news pages): neutral. Placeholders below. */
  --os-desk:#100E0C;  --os-panel:#1A1714;  --os-panel-2:#211D19;  --os-panel-3:#2A251F;  --os-bar:#151210;
  --os-line:#302A23;  --os-line-strong:#423A30;
  --os-text:#D9D2C8;  --os-text-strong:#F2ECE3;  --os-muted:#8C8276;  --os-faint:#8E867C;
  --os-accent:#7FA3C9; --os-accent-ink:#0B1520; --os-accent-soft:#7FA3C91F;

  --ch-panel:#12171C; --ch-panel-2:#171D23; --ch-panel-3:#1E252C; --ch-bar:#0F1418;
  --ch-line:#242C34;  --ch-line-strong:#33404B;
  --ch-text:#D5DBE0;  --ch-text-strong:#F1F4F6; --ch-muted:#7D8892; --ch-faint:#7D8892;
  --ch-accent:#4CC79A; --ch-accent-ink:#04130D; --ch-accent-soft:#4CC79A1F;

  --tp-panel:#16181B; --tp-panel-2:#1C1F23; --tp-panel-3:#24282D; --tp-bar:#131518;
  --tp-line:#2A2E33;  --tp-line-strong:#3A4047;
  --tp-text:#D3D6DA;  --tp-text-strong:#EEF0F2; --tp-muted:#848A92; --tp-faint:#838990;
  --tp-accent:#8FA6BF; --tp-accent-ink:#0E141B; --tp-accent-soft:#8FA6BF1F;

  /* V28 newspaper site (third-party, but print-like). Anu sets values. */
  --paper:#ECE9E2; --paper-ink:#1C1B19; --paper-muted:#5E5A52; --paper-rule:#C8C3B8; --paper-img:#D6D1C6;
  --xp-flash:#E8862A;                 /* V52 taskbar flash */
  --light-dawn:#E8B04A26;   /* V47/V49 desktop tint over the photo: dawn ~15% gold */
  --light-dusk:#E0782A4D;   /* dusk ~30% amber */
  --light-night:#0A16408C;  /* night ~55% deep blue */
  /* V49 desktop sky around the photo: low saturation, ~10–20% off the desk colour */
  --sky-dawn-top:#3A3020; --sky-day-top:#1F262D; --sky-dusk-top:#3A2414; --sky-night-top:#0E1230; --sky-bottom:#100E0C; --sky-night-bottom:#06070D;
  /* V49 day/night dial */
  --dial-dawn-top:#E8B04A; --dial-dawn:#7A5A3A; --dial-day-top:#6FA6D6; --dial-day:#C9DCEB; --dial-dusk-top:#D9762E; --dial-dusk:#4A2A3A; --dial-night:#141A3A;
  --dial-sun:#F4D27A; --dial-moon:#E6E8F0;
  --font-news:Verdana,Arial,Helvetica,sans-serif;   /* V46: 2001 web news (BBC News Online era) */

  /* Motion: Material 3 easing and duration tokens (m3.material.io → Styles → Motion). */
  --m3-emph:cubic-bezier(.2,0,0,1);         /* emphasized (default for most transitions) */
  --m3-emph-dec:cubic-bezier(.05,.7,.1,1);  /* emphasized decelerate: things entering */
  --m3-emph-acc:cubic-bezier(.3,0,.8,.15);  /* emphasized accelerate: things leaving */
  --m3-std:cubic-bezier(.2,0,0,1);          /* standard: small utility changes */
  --m3-std-dec:cubic-bezier(0,0,0,1);
  --m3-std-acc:cubic-bezier(.3,0,1,1);
  --m3-short2:100ms; --m3-short4:200ms; --m3-med2:300ms; --m3-med4:400ms; --m3-long2:500ms;
  --anim:var(--m3-med4);                    /* window open; keep CFG.anim in step */              /* window open/close (V19); keep CFG.animMs in step */

  /* layout */
  --side-col:340px;          /* Stocks + Chat column */
  --log-col:300px;           /* Logistics Tracker column inside the dashboard */

  /* O19 Cipher OS boot and welcome (2001 OS patterns, placeholder values) and the E12 terminal */
  --boot-bg:#000000;
  --boot-text:#C9D1D9;
  --xp-bg:#16304F;           /* welcome screen field */
  --xp-band:#0C1E36;         /* top and bottom bands */
  --xp-rule:#5B7FB0;         /* the divider between the two halves */
  --xp-text:#E8EEF6;
  --xp-muted:#A9BBD3;
  --xp-tile:#24497A;         /* user tile on hover */
  --term-bg:#000000;
  --term-text:#B8C4CF;
  --term-strong:#F1F4F6;
  --term-dim:#6E7A85;
}

/* Pop-up ad skins: deliberately 2005 web junk, never the game's own style.
   Raw colours are allowed here on purpose: these imitate foreign software. */
.pp{position:absolute;width:min(330px,calc(100% - 24px));color:#000}
.pp-xp{background:#ECE9D8;border:1px solid #0831D9;border-radius:8px 8px 2px 2px;box-shadow:3px 4px 12px rgba(0,0,0,.45);font-family:Tahoma,Verdana,Arial,sans-serif;overflow:hidden}
.pp-xp .xt{background:linear-gradient(180deg,#3B8CF5 0%,#0A5FD8 12%,#0848C0 55%,#0636A0 100%);color:#fff;font-weight:700;font-size:13px;padding:4px 4px 4px 9px;display:flex;align-items:center;gap:8px;text-shadow:1px 1px 0 #0A1A50}
.pp-xp .xx{margin-left:auto;width:22px;height:21px;border-radius:3px;background:linear-gradient(#EE8A6E,#C4401F);border:1px solid #fff;color:#fff;font:700 14px/1 Tahoma,Arial,sans-serif;padding:0}
.pp-xp .xbody{padding:14px 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:13px}
.pp-xp .err{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF9A8A,#D8200E 55%,#8A0C04);color:#fff;font:900 20px/34px Arial,sans-serif;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.pp-xp .xmsg p{margin:2px 0 8px}
.pp-xp .fish{width:150px;height:auto;background:#fff;padding:6px;display:block}
.pp-xp .xbtns{grid-column:1/-1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pp-xp .xbtns button{min-width:76px;padding:4px 12px;background:linear-gradient(#FFFFFF,#E5E4DA);border:1px solid #003C74;border-radius:3px;font:12px Tahoma,Verdana,Arial,sans-serif;color:#000}
.pp-xp .xbtns button:hover{box-shadow:inset 0 0 0 2px #F8B636}
.pp-green{background:#fff;border:1px solid #D6D6D6;box-shadow:0 8px 22px rgba(0,0,0,.3);padding:20px 16px 14px;font-family:Arial,Helvetica,sans-serif}
.pp-green .gx{position:absolute;top:3px;right:5px;border:0;background:none;color:#3B8BE0;font-size:11px;padding:2px}
.pp-green .gt{text-align:center;color:#0B3D91;font-weight:700;font-size:21px;margin-bottom:10px}
.pp-green .gbtn{width:100%;background:linear-gradient(#66D433,#3CA514);color:#fff;font:900 42px/1 'Arial Black',Arial,sans-serif;letter-spacing:.02em;border:1px solid #2E8A0E;border-radius:6px;padding:16px 10px;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.pp-green .gsteps{margin-top:10px;font-size:12px;color:#777}
.pp-green .gsteps b{color:#555;font-weight:600}
.pp-green ol{margin:4px 0 0;padding-left:20px}
.pp-congrats{background:#FFF35C;border:5px dotted #E3161B;outline:3px solid #E3161B;outline-offset:-1px;padding:14px 16px 12px;font-family:Arial,Helvetica,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.35);text-align:center}
.pp-congrats h4{margin:0 0 8px;font:900 31px/1 Impact,'Arial Black',Arial,sans-serif;color:#E3161B;text-transform:uppercase;letter-spacing:.01em;text-shadow:2px 2px 0 #fff,3px 3px 0 #B00}
.pp-congrats p{font-weight:700;color:#0B2A8C;font-size:15px;line-height:1.25;margin:0 0 10px}
.pp-congrats .burst{position:absolute;right:-10px;top:38px;width:62px;height:62px;border-radius:50%;background:#E3161B;color:#FFF35C;font:900 15px/62px Impact,'Arial Black',sans-serif;transform:rotate(14deg);box-shadow:0 0 0 4px #FFF35C,0 0 0 6px #E3161B}
.pp-congrats .clk{border:0;background:none;color:#0000EE;text-decoration:underline;font:700 14px Arial,sans-serif;padding:2px}
.pp-congrats .cno{display:block;margin:8px auto 0;border:0;background:none;color:#666;font:11px Arial,sans-serif;text-decoration:underline}
.pp-congrats .cx{position:absolute;top:0;right:3px;border:0;background:none;color:#999;font:11px Arial,sans-serif;padding:2px 4px}

/* NODE components. Layout and structure only: every colour, font and size comes from theme/tokens.css. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--text);font-family:var(--font-ui);font-size:var(--fs-m);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
.ph{color:var(--placeholder);font-family:var(--font-mono);font-size:.92em}

#desk{position:relative;height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,var(--desk-glow),var(--desk) 70%)}

/* status bar (top) */
#top{position:relative;z-index:6;flex:none;background:var(--bar);border-bottom:1px solid var(--line)}
#top:empty{display:none}
.sb{display:flex;align-items:flex-end;gap:28px;padding:10px 16px;flex-wrap:wrap}
.seg{display:grid;gap:2px;align-content:end}
.seg span{font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--muted)}
.seg b{font-family:var(--font-mono);font-size:var(--fs-l);font-weight:var(--fw-med);white-space:nowrap;line-height:1.1;color:var(--text-strong)}
.seg.big b{font-size:var(--fs-xl)}
.seg.owe b{color:var(--down)}
.seg.grow{flex:1}
.brand{font-family:var(--font-mono);font-weight:var(--fw-bold);font-size:var(--fs-m);letter-spacing:.04em;color:var(--accent)}
.timerbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-m);padding:4px 6px 4px 12px;background:var(--panel)}
.timerbox .seg b{font-size:var(--fs-l)}
.timerbox.low .seg b{color:var(--down)}
.ticker{display:flex;gap:12px;align-items:center;padding:6px 16px;border-top:1px solid var(--line);font-size:var(--fs-s);min-height:30px;overflow:hidden}
.ticker .lab{font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-xs);padding:2px 7px;flex:none}
.ticker .lab.news{color:var(--text-strong);border-color:var(--line-strong)}
.ticker .lab.markets{color:var(--accent);border-color:var(--accent)}
#tickTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:tin .35s ease-out}
@keyframes tin{from{opacity:0}}

#screen{position:relative;z-index:1;flex:1;min-height:0;padding:14px;display:flex;gap:14px}
#screen.play{display:grid;grid-template-columns:minmax(0,1fr) var(--side-col);grid-template-rows:auto minmax(0,1fr);gap:14px}
#screen.play>.w-dashboard{grid-row:1/3;position:relative}

/* windows */
.win{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.tb{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--bar);flex:none}
.tb-c{display:flex;gap:5px}
.tb-c i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.tb-t{font-family:var(--font-ui);font-size:var(--fs-s);letter-spacing:0;text-transform:none;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-x{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--muted)}
.wb{flex:1;min-height:0;overflow-y:auto;padding:var(--pad-win)}

/* dashboard */
.dash{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--log-col)}
.dash>.pane{min-height:0;display:flex;flex-direction:column;min-width:0}
.dash>.logcol{border-left:1px solid var(--line)}
.dtabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bar);flex:none}
.dtabs button{border:0;background:none;padding:9px 12px;font-size:var(--fs-s);color:var(--muted);border-bottom:2px solid transparent}
.dtabs button:hover{color:var(--text)}
.dtabs button.on{color:var(--text-strong);border-bottom-color:var(--accent)}
.dtabs .t-log{display:none}
.dtabs .node{margin-left:auto;align-self:center;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--accent);letter-spacing:.04em}

/* taskbar */
#bar{position:relative;z-index:6;flex:none;display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bar);border-top:1px solid var(--line);overflow-x:auto}
#bar:empty{display:none}
.menu{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-m);padding:5px 12px;font-size:var(--fs-s);white-space:nowrap;margin-right:8px}
.menu:hover{border-color:var(--line-strong)}
.app{border:0;background:transparent;border-radius:var(--r-s);padding:6px 10px;font-size:var(--fs-s);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.app:hover{background:var(--panel-2);color:var(--text)}
.app.on{color:var(--text-strong);box-shadow:inset 0 -2px 0 var(--accent);border-radius:var(--r-s) var(--r-s) 0 0}
.badge{background:var(--down);color:var(--text-strong);border-radius:8px;font-size:var(--fs-xs);padding:0 6px;line-height:16px;font-weight:var(--fw-bold)}
.clock{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-s);color:var(--muted);padding-left:12px;white-space:nowrap}

/* shared */
.btn{border:1px solid var(--line-strong);background:var(--panel-3);color:var(--text-strong);border-radius:var(--r-m);padding:8px 14px;font-weight:var(--fw-med);font-size:var(--fs-s);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.act{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:var(--fw-bold)}
.btn.act:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--line-strong)}
.btn.sm{padding:5px 10px;font-size:var(--fs-xs)}
.btn.big{padding:12px 20px;font-size:var(--fs-m)}
.btn.wide{width:100%}
.empty{color:var(--muted);font-size:var(--fs-s);padding:14px 0}
.banner{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-m);padding:10px 12px;font-size:var(--fs-s);color:var(--muted)}
.banner b{color:var(--text-strong)}
.ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--r-s);border:1px solid var(--line);flex:none;background:var(--panel-2)}
.ico svg{width:14px;height:14px;fill:none;stroke:var(--text);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.chip{display:inline-block;font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:var(--track-caps);text-transform:uppercase;padding:1px 6px;border-radius:var(--r-xs);border:1px solid var(--line);color:var(--muted)}
.chip.leg{border-color:var(--rare);color:var(--rare)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.sh h2{font-size:var(--fs-l);font-weight:var(--fw-bold);color:var(--text-strong)}
.sh p{font-size:var(--fs-xs);color:var(--muted);text-align:right}
.receipt{font-size:var(--fs-s);display:grid;gap:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.receipt div{display:flex;justify-content:space-between;gap:10px}
.receipt .tot{font-weight:var(--fw-bold);color:var(--text-strong)}
.receipt span:last-child{font-family:var(--font-mono)}

/* cold open */
.room{position:absolute;inset:0;overflow:hidden;background:var(--desk)}
.room::before{content:'';position:absolute;left:50%;top:46%;width:70vmin;height:52vmin;transform:translate(-50%,-50%);background:radial-gradient(ellipse,var(--crt-glow),transparent 70%);filter:blur(10px)}
.room .rain{position:absolute;inset:-20% 0 0;background:repeating-linear-gradient(100deg,transparent 0 22px,var(--rain) 22px 23px);opacity:.5;animation:rain 1.1s linear infinite}
@keyframes rain{to{transform:translateY(60px)}}
.crt{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);box-shadow:0 0 80px var(--crt-glow),var(--shadow);padding:28px;display:grid;gap:18px}
.crt h1{font-family:var(--font-mono);font-size:var(--fs-xxl);font-weight:var(--fw-bold);color:var(--text-strong);letter-spacing:.02em}
.crt h1 .cur{display:inline-block;width:.55em;height:.9em;background:var(--accent);vertical-align:-.08em;margin-left:2px;animation:cur 1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
.crt p{color:var(--muted)}
.field{display:grid;gap:4px;font-size:var(--fs-xs);color:var(--muted);letter-spacing:0;text-transform:none}
.field b{font-family:var(--font-mono);font-size:var(--fs-m);letter-spacing:0;text-transform:none;color:var(--text-strong);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--panel-2);font-weight:var(--fw-reg)}
.crash{border:1px solid var(--down);border-radius:var(--r-m);padding:12px;display:grid;gap:6px}
.crash .big{font-family:var(--font-mono);font-size:var(--fs-xxl);color:var(--down);line-height:1}
.assign{font-family:var(--font-mono);font-size:var(--fs-xxl);color:var(--accent);letter-spacing:.02em}
.bare{position:absolute;inset:0;background:var(--desk)}
.bare .icon{position:absolute;left:28px;top:28px;display:grid;justify-items:center;gap:6px;border:0;background:none;color:var(--muted);font-family:var(--font-mono);font-size:var(--fs-xs)}
.bare .icon i{width:44px;height:44px;border:1px solid var(--line-strong);border-radius:var(--r-m);display:grid;place-items:center;color:var(--accent);font-style:normal;font-weight:var(--fw-bold)}
.bare .icon:hover i{border-color:var(--accent)}
.bare p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-family:var(--font-mono)}

/* chat (Alekos and friends): WhatsApp-style. Fixed-height window, thread scrolls, newest at the bottom. */
.chatwin{display:flex;flex-direction:column;min-height:0}
.w-desk{position:relative;background:var(--desk)}
.clist{flex:1;min-height:0;overflow-y:auto;background:var(--panel)}
.crow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;color:var(--text)}
.crow:hover{background:var(--panel-2)}
.cr-m{flex:1;min-width:0;display:grid;gap:2px}
.cr-t{display:flex;align-items:baseline;gap:8px}
.cr-t b{flex:1;font-size:var(--fs-m);color:var(--text-strong);font-weight:var(--fw-reg)}
.cr-t small{font-size:var(--fs-xs);color:var(--faint)}
.cr-p{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);color:var(--muted)}
.cr-x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-x em{font-style:normal;color:var(--accent)}
.crow.unread .cr-t b{font-weight:var(--fw-bold)} .crow.unread .cr-t small{color:var(--accent)} .crow.unread .cr-x{color:var(--text)}
.back{border:0;background:none;color:var(--muted);font-size:var(--fs-l);line-height:1;padding:0 4px 0 0}
.back:hover{color:var(--text-strong)}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit;text-align:left;overflow-wrap:anywhere}
.tb-min{border:0;background:none;color:var(--muted);font-size:var(--fs-s);padding:0 2px;line-height:1}
.tb-min:hover{color:var(--text-strong)}
.btabs{display:flex;gap:2px;padding:4px 8px 0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.btab{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-bottom:0;border-radius:var(--r-s) var(--r-s) 0 0;background:none;color:var(--muted);font-size:var(--fs-xs);padding:5px 12px}
.btab.on{background:var(--panel);border-color:var(--line);color:var(--text-strong)}
.bview{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.bpage{flex:1;min-height:0;overflow-y:auto;display:grid;place-items:center;padding:24px}
.bcard{width:min(420px,100%);display:grid;gap:16px;text-align:center}
.art{width:min(620px,100%);display:grid;gap:14px;align-self:start}
.art h1{font-size:var(--fs-xl);color:var(--text-strong);line-height:1.25}
.art p{color:var(--muted);line-height:1.6}
.app.bump{animation:bump var(--m3-med2) var(--m3-emph) 2}
@keyframes bump{40%{transform:translateY(-4px)}}
.pos.crashed{border:1px solid var(--down);border-radius:var(--r-s);padding:4px 6px}
.wa-h{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bar);flex:none}
.mono-av{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--font-mono);font-weight:var(--fw-bold);color:var(--text-strong);flex:none;background:var(--panel-2)}
.wa-h b{display:block;font-size:var(--fs-m);color:var(--text-strong);line-height:1.2}
.wa-h small{display:block;font-size:var(--fs-xs);color:var(--muted)}
.wa-h small.typing{color:var(--accent)}
.wa-h .role{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--faint)}
.wa-b{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.wa-spacer{flex:1 0 0}
.bub{position:relative;max-width:82%;padding:6px 9px 5px;border-radius:var(--r-m);background:var(--panel-2);border:1px solid var(--line);align-self:flex-start;font-size:var(--fs-s);line-height:1.45;flex:none;overflow-wrap:anywhere}
.bub.first{margin-top:6px;border-top-left-radius:2px}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:var(--line-strong)}
.bub.me.first{border-top-left-radius:var(--r-m);border-top-right-radius:2px}
.bub .tm{float:right;margin:6px 0 -3px 10px;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--faint);line-height:1}
.bub.typing-dots{display:flex;gap:4px;padding:10px 12px}
.bub.typing-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:dots 1.2s infinite}
.bub.typing-dots i:nth-child(2){animation-delay:.2s}.bub.typing-dots i:nth-child(3){animation-delay:.4s}
@keyframes dots{0%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}70%{opacity:.25}}
.sep{align-self:center;font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--faint);margin:10px 0 4px;flex:none}
.wa-f{flex:none;border-top:1px solid var(--line);padding:8px 10px;display:grid;gap:8px;background:var(--bar)}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1px solid var(--accent);background:none;color:var(--text-strong);border-radius:999px;padding:5px 12px;font-size:var(--fs-s)}
.suggest button:hover{background:var(--accent-soft)}
.wa-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;color:var(--faint);font-size:var(--fs-s);background:var(--panel)}
.wa-in span{flex:1}
.wa-in i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel-3);color:var(--faint);font-size:var(--fs-xs)}
.terms{align-self:flex-start;border:1px solid var(--line-strong);border-radius:var(--r-m);border-top-left-radius:2px;padding:10px 12px;display:grid;gap:4px;min-width:220px;max-width:86%;font-size:var(--fs-s);background:var(--panel-2);margin-top:6px;flex:none}
.terms div{display:flex;justify-content:space-between;gap:16px}
.terms span{color:var(--muted)}
.terms b{font-family:var(--font-mono);font-weight:var(--fw-med)}
.terms .big{font-size:var(--fs-l);color:var(--down)}

/* windows on top of the dashboard between phases (morning, night, settlement, pass) */
.dover{position:absolute;inset:0;z-index:3;background:var(--scrim);display:grid;place-items:center;padding:16px}
.dcard{width:min(500px,100%);height:min(580px,100%)}
.dgrid{display:grid;gap:12px;align-content:start}

/* procurement deals */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.deal{border:1px solid var(--line);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2);position:relative;overflow:hidden}
.deal.out{opacity:.4;filter:grayscale(1)}
.deal.leg{border-color:var(--rare)}
.d-status{display:flex;align-items:center;gap:8px;min-height:22px}
.d-status .stock{font-size:var(--fs-xs);color:var(--muted);flex:1}
.d-status .stock b{color:var(--warn);font-weight:var(--fw-med)}
.tag{flex:none;font-family:var(--font-mono);font-size:var(--fs-s);color:var(--accent);border:1px solid var(--accent);border-radius:var(--r-xs);padding:1px 6px}
.d-name{display:flex;gap:9px;align-items:flex-start}
.d-name h3{font-size:var(--fs-m);font-weight:var(--fw-bold);line-height:1.25;color:var(--text-strong);text-wrap:balance}
.d-name p{color:var(--muted);font-size:var(--fs-xs);margin-top:3px}
.d-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.d-price strong{font-family:var(--font-mono);font-weight:var(--fw-med);font-size:var(--fs-xl);line-height:1;color:var(--text-strong)}
.d-price s{color:var(--faint);font-size:var(--fs-xs);font-family:var(--font-mono)}
.d-price small{font-size:var(--fs-xs);color:var(--muted)}
.resell{margin-left:auto;font-size:var(--fs-xs);color:var(--muted)}
.resell b{color:var(--text-strong);font-family:var(--font-mono);font-weight:var(--fw-med)}
.tells{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border-top:1px solid var(--line);padding-top:9px;font-size:var(--fs-xs)}
.tells div.full{grid-column:1/-1}
.tells span{display:block;font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--faint)}
.tells b{font-weight:var(--fw-reg);display:block;overflow-wrap:anywhere;font-family:var(--font-mono)}
.d-act{display:flex;gap:8px;align-items:center;margin-top:auto}
.d-act .btn{flex:1}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.qty button{border:0;background:var(--panel-3);width:28px;height:30px}
.qty span{min-width:26px;text-align:center;font-family:var(--font-mono)}
.lbar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--muted);transition:width .25s linear}
.deal.leg .lbar i{background:var(--rare)}
.lbar i.low{background:var(--down)}
.held{color:var(--accent);font-weight:var(--fw-med)}
.cartbar{flex:none;border-top:1px solid var(--line);background:var(--bar);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cartbar .items{flex:1;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.ci{border:1px solid var(--line);border-radius:var(--r-s);padding:2px 4px 2px 9px;font-size:var(--fs-xs);display:flex;align-items:center;gap:2px}
.ci button{border:0;background:none;padding:0 5px;color:var(--muted)}
/* the cart bar lights up while it holds lots, so an added lot is hard to miss */
.cartbar.full{background:var(--accent-soft);border-top:2px solid var(--accent);padding-top:9px}
.cartbar.full .ci{font-size:var(--fs-s);border-color:var(--accent);background:var(--panel-2);color:var(--text-strong);padding:4px 4px 4px 10px}
.cartbar.full .ci .held{color:var(--warn)}
.cartbar.flash{animation:cartFlash 900ms var(--m3-std,ease) both}
@keyframes cartFlash{0%{box-shadow:inset 0 0 0 999px #4CC79A40}100%{box-shadow:inset 0 0 0 999px transparent}}
.cartbar strong{font-family:var(--font-mono);font-weight:var(--fw-med);font-size:var(--fs-l);color:var(--text-strong)}
.daysum{flex:none;display:flex;gap:18px;flex-wrap:wrap;padding:6px 14px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--muted)}
.daysum b{color:var(--text-strong);font-family:var(--font-mono);font-weight:var(--fw-med)}
.cqty{display:flex;align-items:center;gap:6px}
.cqty button{width:24px;height:24px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-s);padding:0}
.coline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.coline .nm{min-width:0}
.coline .nm small{display:block;color:var(--muted);font-size:var(--fs-xs)}

/* logistics */
.slips{display:flex;flex-direction:column;gap:10px}
.slip{border:1px solid var(--line);border-radius:var(--r-l);padding:10px 11px;display:flex;flex-direction:column;gap:7px;flex:none;background:var(--panel-2)}
.slip.alert{border-color:var(--down)}
.slip-h{display:flex;gap:9px;align-items:center}
.slip-h h3{font-size:var(--fs-s);font-weight:var(--fw-bold);line-height:1.25;flex:1;min-width:0;color:var(--text-strong)}
.meta{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st{font-size:var(--fs-xs);text-transform:none;letter-spacing:0}
.st.good{color:var(--up)} .st.bad{color:var(--down)} .st.warn{color:var(--warn)} .st.mute{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.steps i{height:2px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--muted)} .steps i.cur{background:var(--accent);animation:bl 1.2s steps(2) infinite}
.steps.bad i.on,.steps.bad i.cur{background:var(--down);animation:none}
@keyframes bl{50%{opacity:.3}}
.log{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:var(--fs-xs)}
.log li{display:grid;grid-template-columns:38px 1fr;gap:8px}
.log time{color:var(--faint);font-family:var(--font-mono)}
.log li.warn span{color:var(--warn)} .log li.bad span{color:var(--down)} .log li.good span{color:var(--up)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ofilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ofilter button{border:1px solid var(--line);background:none;border-radius:var(--r-s);padding:3px 9px;font-size:var(--fs-xs);color:var(--muted);display:flex;gap:6px}
.ofilter button b{font-family:var(--font-mono);color:var(--text)}
.ofilter button.on{border-color:var(--accent);color:var(--text-strong)}
.dsep{align-self:center;font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--faint)}

/* marketplace */
.stoop{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;min-height:0;height:100%}
.stoop>div{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r-l);padding:12px;background:var(--panel-2);flex:none}
.tools .stat{display:flex;gap:18px;align-items:flex-end}
.boosts{display:flex;gap:6px;flex-wrap:wrap}
.boost{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);padding:6px 9px;text-align:left;font-size:var(--fs-xs);display:grid;gap:1px;max-width:190px}
.boost:hover:not(:disabled){border-color:var(--line-strong)}
.boost b{font-size:var(--fs-s);font-weight:var(--fw-med);color:var(--text-strong)}
.boost small{color:var(--muted)}
.boost:disabled{opacity:.4;cursor:not-allowed}
.running{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.run{position:relative;overflow:hidden;border:1px solid var(--accent);color:var(--accent);border-radius:var(--r-s);padding:3px 10px 5px;font-size:var(--fs-xs);font-weight:var(--fw-med)}
.run i{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width .25s linear}
.run.bad{border-color:var(--down);color:var(--down)} .run.bad i{background:var(--down)}
.stack{border:1px solid var(--line);border-radius:var(--r-l);padding:11px;display:grid;gap:9px;background:var(--panel-2);flex:none}
.stack.listed{border-color:var(--line-strong)}
.stack .r1{display:flex;gap:9px;align-items:center}
.stack .r1 h3{font-size:var(--fs-s);font-weight:var(--fw-bold);flex:1;line-height:1.25;color:var(--text-strong)}
.stack .q{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--muted)}
.stack .r2{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);gap:8px;flex-wrap:wrap}
.stack .r2 b{color:var(--text-strong);font-family:var(--font-mono);font-weight:var(--fw-med)}
.asker{display:flex;align-items:center;gap:6px}
.asker .ask{font-family:var(--font-mono);font-size:var(--fs-l);min-width:84px;text-align:center;color:var(--text-strong)}
.stepb{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-m)}
.msg{border:1px solid var(--line);border-radius:var(--r-l);padding:9px 11px;display:grid;gap:6px;background:var(--panel-2);flex:none}
.msg .mh{display:flex;gap:8px;align-items:center}
.msg .mh h4{font-size:var(--fs-s);font-weight:var(--fw-bold);flex:1;min-width:0;line-height:1.25;color:var(--text-strong)}
.msg .mh .num{font-size:var(--fs-xs);color:var(--muted)}
.msg .who{font-size:var(--fs-xs);color:var(--muted)}
.msg .flag{font-size:var(--fs-xs);color:var(--down)}
.msg.closed{opacity:.5}
.cmp{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;font-size:var(--fs-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.cmp b{color:var(--text-strong);font-family:var(--font-mono);font-weight:var(--fw-med);font-size:var(--fs-s)}
.cmp .pl{margin-left:auto;font-family:var(--font-mono)}
.waiting{font-size:var(--fs-xs);color:var(--muted)}

/* stocks */
.w-stocks .wb{padding:10px 12px;display:grid;gap:7px;overflow:visible;flex:none}
.mk-top{display:flex;align-items:baseline;gap:10px}
.mk-top b{font-family:var(--font-mono);font-weight:var(--fw-med);font-size:var(--fs-xl);line-height:1;color:var(--text-strong)}
.mk-chart{width:100%;height:54px;display:block;background:var(--panel-2);border-radius:var(--r-s)}
.mk-chart polyline{fill:none;stroke:var(--text);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mk-chart line{stroke:var(--line-strong);stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.mk-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mk-hold{font-size:var(--fs-xs);color:var(--muted);flex:1;min-width:120px}
.mk-hold b{color:var(--text-strong);font-family:var(--font-mono);font-weight:var(--fw-med)}
.pos{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:var(--fs-xs);border-top:1px solid var(--line);padding-top:6px;color:var(--muted)}

/* overlays */
#float{position:fixed;inset:0;z-index:10;pointer-events:none}
#float>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px}
.sheet{width:min(460px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column}
.sheet.s-mid{height:min(460px,calc(100% - 20px))}
.sheet.s-tall{height:min(640px,calc(100% - 20px))}
.sheet.chatwin .wa-b{flex:1}
.sheet .wb{display:flex;flex-direction:column;gap:12px}
.lines{display:grid;gap:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;font-size:var(--fs-s)}
.lines>div{display:flex;justify-content:space-between;gap:10px}
.lines .tot{font-weight:var(--fw-bold);color:var(--text-strong)}
.cards{display:grid;gap:6px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-m);padding:9px 11px}
.card:hover:not(:disabled){border-color:var(--line-strong)}
.card.sel{border-color:var(--accent)}
.card:disabled{opacity:.35;cursor:not-allowed}
.cc{width:30px;height:20px;border-radius:var(--r-xs);border:1px solid var(--line-strong);background:var(--panel-3)}
.card b{display:block;font-size:var(--fs-s)}
.card small{color:var(--muted);font-size:var(--fs-xs)}
.card .bal{font-family:var(--font-mono)}
.fav{width:30px;height:30px;border-radius:var(--r-s);border:1px solid var(--line-strong);display:grid;place-items:center;font-weight:var(--fw-bold);flex:none}
.toggle{display:flex;align-items:center;gap:10px;font-size:var(--fs-s);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 11px;background:var(--panel-2);text-align:left}
.toggle .box{width:15px;height:15px;border:1px solid var(--muted);border-radius:var(--r-xs);flex:none;display:grid;place-items:center;font-size:var(--fs-xs)}
.toggle.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.co-msg{font-size:var(--fs-s);padding:8px 10px;border-radius:var(--r-m);background:var(--panel-2)}
.co-msg.bad{color:var(--down)}
.timer{font-family:var(--font-mono);font-size:var(--fs-l)}
.timer.low{color:var(--down)}
.menupop{position:absolute;left:10px;bottom:52px;width:250px}
.menupop .wb{display:grid;gap:6px;padding:10px}
.menupop button{text-align:left}
.pp{position:absolute;width:min(330px,calc(100% - 24px))}
#notes{position:fixed;left:50%;transform:translateX(-50%);top:96px;flex-direction:column-reverse;z-index:9;display:flex;gap:8px;width:min(340px,calc(100% - 28px));pointer-events:none}
.note{pointer-events:auto;text-align:left;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--panel);box-shadow:var(--shadow);padding:9px 12px;font-size:var(--fs-s);animation:noteIn var(--m3-med2) var(--m3-emph-dec);display:grid;gap:2px;color:var(--text)}
.note b{font-family:var(--font-mono);font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--muted)}
